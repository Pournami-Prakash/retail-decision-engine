name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[modeling,dev]"
      - run: ruff check src tests dashboard
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src dashboard
      - run: python -m json.tool contracts/decision_request.schema.json > /dev/null
      - run: python -m json.tool contracts/decision_response.schema.json > /dev/null
      - run: python -m json.tool contracts/store_item_week.schema.json > /dev/null
