[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-decision-engine"
version = "0.2.0"
description = "Reproducible retail price-elasticity and promotion decision system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
modeling = [
  "arviz>=0.20",
  "duckdb>=1.1,<2.0",
  "h5netcdf>=1.4",
  "h5py>=3.12",
  "ortools>=9.11",
  "pymc>=5.20",
  "scikit-learn>=1.6",
  "scipy>=1.14",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.9,<0.16",
]

[project.scripts]
retail-decision = "retail_decision_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
